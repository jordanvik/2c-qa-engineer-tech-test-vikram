trigger:
  branches:
    include:
      - main
      - develop
      - feature/*

pr:
  branches:
    include:
      - main
      - develop

variables:
  NODE_VERSION: '20.x'
  CI: 'true'
  # Playwright: playwright.config.ts → use.trace = retain-on-failure (all projects).
  # Failed tests write trace-*.zip under test-results/ — published as artifact playwright-test-results below.

stages:

# Lint & Unit Tests
  
  - stage: UnitTests
    displayName: 'Lint & Unit Tests'
    jobs:
      - job: Unit
        displayName: 'Vitest unit tests + coverage'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            displayName: 'Use Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npm run lint
            displayName: 'ESLint'

          - script: npm run test:coverage -- --reporter=junit --outputFile=test-results/vitest-junit.xml
            displayName: 'Run unit tests with coverage'
            env:
              CI: 'true'

          - task: PublishTestResults@2
            displayName: 'Publish Vitest JUnit results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'test-results/vitest-junit.xml'
              testRunTitle: 'Unit Tests'
              failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@2
            displayName: 'Publish code coverage'
            condition: always()
            inputs:
              summaryFileLocation: 'coverage/lcov.info'
              failIfCoverageEmpty: false

          - task: PublishPipelineArtifact@1
            displayName: 'Upload Allure results (unit)'
            condition: always()
            inputs:
              targetPath: 'allure-results'
              artifact: 'allure-results-unit'

# E2E Tests (Playwright)
  
  - stage: E2ETests
    displayName: 'E2E Tests (Playwright)'
    dependsOn: UnitTests
    jobs:

      - job: Playwright
        displayName: 'Playwright — all projects'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 30
        steps:
          - task: NodeTool@0
            displayName: 'Use Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npx playwright install --with-deps
            displayName: 'Install Playwright browsers'

          - script: npm run build
            displayName: 'Build Next.js app'

          - script: npm run test:e2e
            displayName: 'Run Playwright tests'
            env:
              CI: 'true'
              BASE_URL: 'http://localhost:3000'
              # Trace zips on failure: global retain-on-failure in playwright.config.ts (test-results/*.zip).

          - task: PublishTestResults@2
            displayName: 'Publish Playwright JUnit results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'test-results/results.xml'
              testRunTitle: 'E2E Tests (Playwright)'
              failTaskOnFailedTests: true

          - task: PublishPipelineArtifact@1
            displayName: 'Upload Playwright HTML report'
            condition: always()
            inputs:
              targetPath: 'playwright-report'
              artifact: 'playwright-html-report'

          - task: PublishPipelineArtifact@1
            displayName: 'Upload Playwright traces & screenshots'
            condition: always()
            inputs:
              targetPath: 'test-results'
              artifact: 'playwright-test-results'

          - task: PublishPipelineArtifact@1
            displayName: 'Upload Allure results (E2E)'
            condition: always()
            inputs:
              targetPath: 'allure-results'
              artifact: 'allure-results-e2e'

# Allure Report
  
  - stage: AllureReport
    displayName: 'Generate Allure Report'
    dependsOn:
      - UnitTests
      - E2ETests
    condition: always()
    jobs:
      - job: Allure
        displayName: 'Merge & publish Allure report'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            displayName: 'Use Node.js $(NODE_VERSION)'
            inputs:
              versionSpec: $(NODE_VERSION)

          - task: DownloadPipelineArtifact@2
            displayName: 'Download unit Allure results'
            inputs:
              artifact: 'allure-results-unit'
              path: 'allure-results'

          - task: DownloadPipelineArtifact@2
            displayName: 'Download E2E Allure results'
            inputs:
              artifact: 'allure-results-e2e'
              path: 'allure-results'

          - script: |
              npm install -g allure-commandline
              allure generate allure-results --clean -o allure-report
            displayName: 'Generate Allure HTML report'

          - task: PublishPipelineArtifact@1
            displayName: 'Upload Allure HTML report'
            inputs:
              targetPath: 'allure-report'
              artifact: 'allure-html-report'
